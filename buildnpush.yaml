trigger:
  branches:
    include:
      - main

variables:
  imageName: az-nodejs-app
  dockerRegistryServiceConnection: acr_connect  # Replace with your actual service connection name

stages:
- stage: BuildAndPush
  displayName: Build and Push Docker Image to ACR
  jobs:
  - job: Build
    displayName: Build and Push
    pool:
      name: Default  # This should match the name of your self-hosted agent pool

    steps:
    - checkout: self  # Correct syntax to pull code

    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: buildAndPush
        repository: $(imageName)
        dockerfile: '**/Dockerfile'
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          latest
          $(Build.BuildId)


