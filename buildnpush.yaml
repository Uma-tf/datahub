trigger:
  branches:
    include:
      - main   

variables:
  imageName: az-nodejs-app
  containerRegistry: datahubtore.azurecr.io   # ACR login server
  dockerRegistryServiceConnection: acr-connect  # service connection name

stages:
- stage: BuildAndPush
  displayName: Build and Push Docker Image to ACR
  jobs:
  - job: Build
    displayName: Build and Push
    pool:
      vmImage: 'default'   # Use self-hosted if you have one

    steps:
    - task: Checkout@1

    - task: Docker@2
      displayName: Build and Push Docker Image
      inputs:
        containerRegistry: $(dockerRegistryServiceConnection)
        repository: $(containerRegistry)/$(imageName)
        command: buildAndPush
        Dockerfile: Dockerfile
        tags: |
          latest
          $(Build.BuildId)

