resources:
  pipelines:
    - pipeline: buildPipeline
      source: 'docker-ci'
      trigger:
        branches:
          include:
            - main

trigger: none

stages:
- stage: DeployDev
  displayName: Deploy to Dev
  dependsOn: []
  condition: succeeded()
  jobs:
  - deployment: HelmDeployDev
    environment: dev
    pool:
      vmImage: 'Default'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: HelmDeploy@0
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceConnection: 'aks-dev-connect'
              namespace: 'dev'
              command: 'upgrade'
              chartType: 'FilePath'
              chartPath: 'charts/your-app'
              releaseName: 'az-node-dev'
              overrideValues: '-f .azure-pipelines/helm-values/dev-values.yaml'
              install: true

- stage: DeployTest
  displayName: Deploy to Test
  dependsOn: DeployDev
  condition: succeeded()
  jobs:
  - deployment: HelmDeployTest
    environment: test
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: HelmDeploy@0
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceConnection: 'aks-dev-connect'
              namespace: 'test'
              command: 'upgrade'
              chartType: 'FilePath'
              chartPath: 'charts/your-app'
              releaseName: 'az-node-test'
              overrideValues: '-f .azure-pipelines/helm-values/test-values.yaml'
              install: true

- stage: DeployProd
  displayName: Deploy to Prod
  dependsOn: DeployTest
  condition: succeeded()
  jobs:
  - deployment: HelmDeployProd
    environment: prod  # configure approvals in the UI under Pipelines → Environments → prod
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: HelmDeploy@0
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceConnection: 'aks-dev-connect'
              namespace: 'prod'
              command: 'upgrade'
              chartType: 'FilePath'
              chartPath: 'charts/your-app'
              releaseName: 'az-node-prod'
              overrideValues: '-f .azure-pipelines/helm-values/prod-values.yaml'
              install: true
