# .azure-pipelines/multi-stage-pipeline.yml
trigger:
  branches:
    include:
      - main

variables:
  imageName: 'az-nodejs-app'
  dockerRegistryServiceConnection: 'AzureContainerRegistryConnection'
  acrName: '<your-acr-name>'
  kubernetesServiceConnection: 'AKS-Connection'
  namespace: 'default'

stages:

- stage: Build
  displayName: Build and Push
  jobs:
  - job: Build
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: Build and Push Image
      inputs:
        containerRegistry: $(dockerRegistryServiceConnection)
        repository: $(imageName)
        command: buildAndPush
        Dockerfile: '**/Dockerfile'
        tags: '$(Build.BuildId)'

- stage: DeployDev
  displayName: Deploy to Dev
  dependsOn: Build
  jobs:
  - deployment: DeployDev
    environment: dev
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@1
            displayName: Deploy to Dev
            inputs:
              kubernetesServiceConnection: $(kubernetesServiceConnection)
              namespace: $(namespace)
              manifests: manifests/dev/deployment.yaml
              containers: |
                $(acrName).azurecr.io/$(imageName):$(Build.BuildId)

- stage: DeployTest
  displayName: Deploy to Test
  dependsOn: DeployDev
  condition: succeeded()
  jobs:
  - deployment: DeployTest
    environment: test
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@1
            displayName: Deploy to Test
            inputs:
              kubernetesServiceConnection: $(kubernetesServiceConnection)
              namespace: $(namespace)
              manifests: manifests/test/deployment.yaml
              containers: |
                $(acrName).azurecr.io/$(imageName):$(Build.BuildId)

- stage: DeployProd
  displayName: Deploy to Prod
  dependsOn: DeployTest
  condition: succeeded()
  jobs:
  - deployment: DeployProd
    environment: prod
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@1
            displayName: Deploy to Prod
            inputs:
              kubernetesServiceConnection: $(kubernetesServiceConnection)
              namespace: $(namespace)
              manifests: manifests/prod/deployment.yaml
              containers: |
                $(acrName).azurecr.io/$(imageName):$(Build.BuildId)
